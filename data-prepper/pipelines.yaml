# Data Prepper: receives OTLP traces from the Collector (gRPC :21890) and indexes them into OpenSearch.
entry-pipeline:
  delay: "100"
  source:
    otel_trace_source:
      ssl: false              # plain gRPC inside the Docker network
      port: 21890
  sink:
    - pipeline:
        name: "raw-trace-pipeline"
    - pipeline:
        name: "service-map-pipeline"

raw-trace-pipeline:           # -> index otel-v1-apm-span-* (searchable by traceId, serviceName, status.code ...)
  source:
    pipeline:
      name: "entry-pipeline"
  processor:
    - otel_traces:
  sink:
    - opensearch:
        hosts: ["http://opensearch:9200"]
        index_type: trace-analytics-raw

service-map-pipeline:         # -> index otel-v2-apm-service-map (powers the Service map in Dashboards)
  delay: "100"
  source:
    pipeline:
      name: "entry-pipeline"
  processor:
    - service_map:
  sink:
    - opensearch:
        hosts: ["http://opensearch:9200"]
        index_type: trace-analytics-service-map
